name: Validate registry
on:
  push:
    paths: ["registry/**", "schemas/**", "scripts/**", "tests/**", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["registry/**", "schemas/**", "scripts/**", "tests/**", ".github/workflows/validate.yml"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registry records
        run: python scripts/validate_registry.py
      - name: Run scanner tests
        run: python -m unittest discover -s tests -v
