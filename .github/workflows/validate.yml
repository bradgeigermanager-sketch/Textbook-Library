name: Validate registry
on:
  push:
    paths: ["registry/**", "schemas/**", "scripts/**", "tests/**", "examples/**", "requirements-dev.txt", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["registry/**", "schemas/**", "scripts/**", "tests/**", "requirements-dev.txt", ".github/workflows/validate.yml"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate resource registry records
        run: python scripts/validate_registry.py
      - name: Validate generalized visual forms
        run: python scripts/validate_visual_forms.py
      - name: Validate visual JSON schemas
        run: python scripts/validate_visual_schemas.py
      - name: Smoke-test visual form matcher
        run: python scripts/visual_form_matcher.py examples/visual-form-candidate.json
      - name: Run scanner, resolver, and matcher tests
        run: python -m unittest discover -s tests -v
